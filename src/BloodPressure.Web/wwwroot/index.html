<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BloodPressure.Web</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BloodPressure.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/charts.js"></script>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        window.bpModal = {
            show: function (id) {
                var element = document.getElementById(id);
                if (!element) return;
                bootstrap.Modal.getOrCreateInstance(element).show();
            },
            hide: function (id) {
                var element = document.getElementById(id);
                if (!element) return;
                bootstrap.Modal.getOrCreateInstance(element).hide();
            }
        };

        window.bpPickers = {
            initTime: function () {
                if (!window.flatpickr) return;
                var elements = document.querySelectorAll(".bp-timepicker");
                elements.forEach(function (el) {
                    if (el._flatpickr) return;
                    flatpickr(el, {
                        enableTime: true,
                        noCalendar: true,
                        dateFormat: "H:i",
                        time_24hr: true,
                        minuteIncrement: 1,
                        allowInput: true
                    });
                });
            },
            initDate: function () {
                if (!window.flatpickr) return;
                var elements = document.querySelectorAll(".bp-datepicker");
                elements.forEach(function (el) {
                    if (el._flatpickr) return;
                    flatpickr(el, {
                        dateFormat: "Y-m-d",
                        allowInput: true
                    });
                });
            },
            init: function () {
                window.bpPickers.initDate();
                window.bpPickers.initTime();
            },
            observe: function () {
                if (window.bpPickers._observer) return;
                var root = document.getElementById("app");
                if (!root) return;
                window.bpPickers._observer = new MutationObserver(function () {
                    window.bpPickers.init();
                });
                window.bpPickers._observer.observe(root, { childList: true, subtree: true });
            }
        };

        window.bpLocalization = {
            getLanguage: function (key) {
                try {
                    return localStorage.getItem(key);
                } catch {
                    return null;
                }
            },
            setLanguage: function (key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch { }
            },
            applyDocumentLanguage: function (langCode) {
                if (!langCode) return;
                document.documentElement.lang = langCode;
            }
        };

        window.bpTheme = {
            getTheme: function (key) {
                try {
                    return localStorage.getItem(key);
                } catch {
                    return null;
                }
            },
            setTheme: function (key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch { }
            },
            getSystemTheme: function () {
                try {
                    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                } catch {
                    return "light";
                }
            },
            applyTheme: function (theme) {
                var normalized = theme === "dark" ? "dark" : "light";
                document.documentElement.setAttribute("data-bs-theme", normalized);
            }
        };

        window.bpAuth = {
            isEmbeddedBrowser: function () {
                var ua = navigator.userAgent || "";
                var isAndroidWebView = /\bwv\b/.test(ua) || /Version\/[\d.]+ Chrome\/[\d.]+ Mobile/.test(ua);
                var isiOSWebView = /(iPhone|iPod|iPad).*AppleWebKit(?!.*Safari)/i.test(ua);
                var isInAppBrowser = /(FBAN|FBAV|Instagram|Line|MicroMessenger|Twitter|LinkedInApp)/i.test(ua);
                return isAndroidWebView || isiOSWebView || isInAppBrowser;
            }
        };

        document.addEventListener("DOMContentLoaded", function () {
            window.bpPickers.init();
            window.bpPickers.observe();
            var currentTheme = window.bpTheme.getTheme("bp.theme") || window.bpTheme.getSystemTheme();
            window.bpTheme.applyTheme(currentTheme);
        });
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
